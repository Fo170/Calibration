; Fichier exemple platformio.ini pour utiliser la librairie Calibration
; Copiez ce fichier dans le dossier de votre projet PlatformIO
;
; Calibration dépend de Smoothing : les deux librairies sont déclarées ci-dessous
; (toujours avec l'URL git complète, jamais la forme courte Fo170/<nom>).

; Pour ESP8266, utilisez :
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/Fo170/Calibration.git@^1.1.0
    https://github.com/Fo170/Smoothing.git@^1.1.1

; Pour ESP32, utilisez :
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/Fo170/Calibration.git@^1.1.0
    https://github.com/Fo170/Smoothing.git@^1.1.1
